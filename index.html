<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece6dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Düğün Planı">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Düğün Planı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Sonbahar: taş rengi zemin, krem kartlar, açık ve koyu kahve vurgular. Tek sütun, telefona göre. */
:root{
  --bg:#ece6dd; --surface:#f9f5ef; --sunk:#e4dccf; --fg:#3a2a1e; --muted:#76624f; --line:#d8cbb9;
  --accent:#8b5a35; --accent-strong:#6f4426; --accent-soft:#eadac5; --on-accent:#fbf6ef;
  --done:#5b6a36; --done-soft:#e1e2c9; --warn:#a9481c; --warn-soft:#f1dac9; --gold:#a87a1f; --gold-soft:#f1e3c2;
  --display:"Young Serif",Georgia,serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(58,42,30,.06),0 2px 8px rgba(58,42,30,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1814; --surface:#2a221c; --sunk:#241d18; --fg:#f1e8dc; --muted:#b5a490; --line:#3e3329;
  --accent:#d9a273; --accent-strong:#e8b98f; --accent-soft:#3b2c20; --on-accent:#1e1814;
  --done:#aab97e; --done-soft:#2a2e1d; --warn:#e48a5f; --warn-soft:#3a2418; --gold:#e0b55a; --gold-soft:#3a2f17;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1814; --surface:#2a221c; --sunk:#241d18; --fg:#f1e8dc; --muted:#b5a490; --line:#3e3329;
  --accent:#d9a273; --accent-strong:#e8b98f; --accent-soft:#3b2c20; --on-accent:#1e1814;
  --done:#aab97e; --done-soft:#2a2e1d; --warn:#e48a5f; --warn-soft:#3a2418; --gold:#e0b55a; --gold-soft:#3a2f17;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.wrap{max-width:720px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.1;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:flex-end;gap:10px}
.kicker{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.kicker svg{width:14px;height:14px;color:var(--accent)}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.panel{display:flex;flex-direction:column;gap:18px}
/* Sekme düğmeleri */
.sub{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.sub::-webkit-scrollbar{display:none}
.sub button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-size:.92rem;cursor:pointer;white-space:nowrap;flex:none}
.sub button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:.9rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* Kartlar */
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.box.click{cursor:pointer}
.box.hl{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;box-shadow:var(--shadow)}
.sum.click{cursor:pointer}
.sum .t{font-size:.8rem;color:var(--muted)} .sum .v{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent);border-radius:3px} .bar.done i{background:var(--done)} .bar.over i{background:var(--warn)}
.section{display:flex;flex-direction:column;gap:2px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
ul{list-style:none;margin:0;padding:0}
.item{border-bottom:1px dashed var(--line);padding:11px 0;display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.iline{display:flex;gap:12px;align-items:flex-start}
.iline input[type=checkbox]{width:24px;height:24px;margin:0;margin-top:1px;accent-color:var(--done);flex:none;cursor:pointer}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ibody.click{cursor:pointer}
.ttl{overflow-wrap:anywhere;font-weight:500}
.item.done .ttl{color:var(--muted);text-decoration:line-through;font-weight:400}
.meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px}
.meta b{color:var(--accent);font-weight:600} .item.done .meta b{color:var(--muted)}
.late{color:var(--warn);font-weight:600}
.ok{color:var(--done);font-weight:600}
.pill{font-size:.74rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--done-soft);color:var(--done)} .pill.late{background:var(--warn-soft);color:var(--warn)} .pill.wait{background:var(--sunk);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.more{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 6px;font-size:.88rem;white-space:nowrap;font-weight:500}
.star{border:0;background:none;cursor:pointer;font-size:1.25rem;line-height:1;padding:2px 4px;color:var(--line);flex:none}
.star[aria-pressed="true"]{color:var(--gold)}
.detail{display:flex;flex-direction:column;gap:12px;background:var(--sunk);border-radius:12px;padding:12px}
/* Formlar */
.fgrid{display:flex;flex-wrap:wrap;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:.86rem;color:var(--muted);flex:1 1 150px;min-width:0}
.field.wide{flex-basis:100%}
.field input,.field select,.field textarea,.inp{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;width:100%;color:var(--fg)}
.field select,.inp[type=date]{min-height:44px}
.field.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:.95rem;flex:0 1 auto;min-height:40px}
.field.check input{width:22px;height:22px;accent-color:var(--done)}
.multi{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--fg);font-size:.95rem}
.multi label{display:flex;gap:6px;align-items:center}
.multi input{width:20px;height:20px;accent-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
details.morefields{border-top:1px dashed var(--line);padding-top:8px}
details.morefields>summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:.92rem;list-style:none;padding:4px 0}
details.morefields>summary::-webkit-details-marker{display:none}
details.morefields>summary::before{content:"+ "}
details.morefields[open]>summary::before{content:"− "}
details.morefields>.fgrid{margin-top:10px}
.editbox{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:disabled{opacity:.6}
.btn.add{width:100%;background:var(--accent-soft);color:var(--accent-strong);border:1.5px dashed var(--accent);min-height:48px;font-size:1rem}
.btn.ghost{background:var(--accent-soft);color:var(--accent-strong)}
.btn.link{background:none;color:var(--accent);padding:6px 4px;font-weight:500;min-height:0}
.btn.danger{background:none;color:var(--warn);padding:6px 8px;font-weight:500;min-height:0}
.btn.small{padding:6px 12px;font-size:.88rem;min-height:34px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;cursor:pointer;flex:none;display:grid;place-items:center}
.empty{color:var(--muted);background:var(--sunk);border-radius:14px;padding:18px;text-align:center;font-size:.95rem}
.tip{border-left:3px solid var(--accent);padding:4px 12px;color:var(--muted);font-size:.92rem}
.alert{border-radius:14px;padding:12px 14px;background:var(--warn-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{border-radius:14px;padding:12px 14px;background:var(--done-soft);color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 4px 3px 11px;font-size:.88rem}
.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:4px 8px}
.time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);min-width:48px}
.hit mark{background:var(--accent-soft);color:var(--accent-strong);border-radius:3px;padding:0 2px}
.calmenu{display:flex;flex-wrap:wrap;gap:6px}
.addbar{display:flex;flex-direction:column;gap:8px}
.addbar .row .inp{flex:1}
/* Altın kartı */
.goldcard{border-color:var(--gold);background:linear-gradient(160deg,var(--gold-soft),var(--surface) 65%)}
.goldcard h3{color:var(--gold)}
.ggrid{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;align-items:baseline}
.ggrid .gh{font-size:.75rem;color:var(--muted);text-align:right}
.ggrid .gn{font-weight:500}
.ggrid .gv{font-family:var(--display);font-size:1.12rem;text-align:right}
/* Fotoğraflar */
.phs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th{width:68px;height:68px;border-radius:10px;border:1px solid var(--line);padding:0;overflow:hidden;background:var(--sunk);cursor:zoom-in;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th{display:grid;place-items:center}
.th.missing img{display:none}
.th.missing::after{content:"?";color:var(--muted)}
.phadd{width:68px;height:68px;border-radius:10px;border:1.5px dashed var(--accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;cursor:pointer;gap:2px;position:relative;flex:none;background:var(--surface)}
.phadd svg{width:22px;height:22px}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.94);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
#viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;touch-action:pinch-zoom}
#viewer .vbar{display:flex;gap:10px;justify-content:space-between;padding-top:12px}
#viewer .btn.danger{color:#f0a481}
/* Hızlı takı girişi */
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips label{position:relative}
.rchips input{position:absolute;opacity:0;pointer-events:none}
.rchips span{display:inline-block;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:99px;font-size:.92rem;cursor:pointer}
.rchips input:checked+span{background:var(--gold-soft);border-color:var(--gold);color:var(--fg);font-weight:600}
.rchips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.notetext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
/* Alt menü */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:flex;width:100%;max-width:720px}
.tabbar button{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--muted);cursor:pointer}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;max-width:calc(100% - 40px);z-index:60;text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="flex:1;min-width:0"><span class="kicker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-14 15-14-1 9-7 15-15 14z"/><path d="M5 19l8-8"/></svg>Fatih &amp; Merve</span><h1 id="pagetitle">Bugün</h1></div>
    <button class="icon" id="searchbtn" aria-label="Ara"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </div>
  <div class="search" id="searchbox" hidden><input id="q" type="search" placeholder="İş, not, harcama, davetli, firma ara…" aria-label="Ara" autocomplete="off"><button class="btn link" id="searchclose">Kapat</button></div>
  <main id="main" class="panel"><div class="empty">Yükleniyor…</div></main>
</div>
<nav class="tabbar" aria-label="Bölümler"><div class="in" id="tabbar">
  <button data-sec="bugun"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Bugün</button>
  <button data-sec="plan"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 15h8"/></svg>Plan</button>
  <button data-sec="para"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/></svg>Para</button>
  <button data-sec="liste"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Listeler</button>
  <button data-sec="ayar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</button>
</div></nav>
<div id="viewer" hidden role="dialog" aria-label="Fotoğraf"><div class="vimg"><img id="vimg" alt="Fotoğraf"></div><div class="vbar"><button class="btn danger" id="vdel">Fotoğrafı kaldır</button><button class="btn" id="vclose">Kapat</button></div></div>
<div id="toast" hidden></div>

<script src="migrate.js"></script>
<script src="store.js"></script>
<script>
(function(){
  // ---------- Sabitler ----------
  var DEF = {

    rooms:['Salon','Mutfak','Yatak odası','Banyo','Antre','Çocuk / misafir odası','Beyaz eşya','Elektronik','Diğer']

  var LISTNAMES = {who:'Görev alan kişiler', payers:'Ödeme yapanlar', cats:'Harcama kategorileri', vtypes:'Rehber türleri', sides:'Davetli tarafları', giftTypes:'Takı / hediye türleri', rooms:'Çeyiz odaları'};

  var COLLS = ['events','phases','tasks','expenses','vendors','guests','gifts','ceyiz','payments','schedule','notes'];
  var PHOTO_COLLS = ['tasks','expenses','payments','vendors','ceyiz','notes'];
  // Takı türü -> fiyat anahtarı ve birim (bilezik gram üzerinden, 22 ayar)

  function compact(d){ return d.replace(/-/g,''); }
  function endOf(it){ var e=new Date(parse(it.date)); var hm=it.time.split(':'); e.setHours(+hm[0]+1,+hm[1]); return compact(iso(e))+'T'+String(e.getHours()).padStart(2,'0')+String(e.getMinutes()).padStart(2,'0')+'00'; }
  function icsFor(it){
    var start, end;
    if(it.time){ start='DTSTART:'+compact(it.date)+'T'+it.time.replace(':','')+'00'; end='DTEND:'+endOf(it); }
    else { start='DTSTART;VALUE=DATE:'+compact(it.date); end='DTEND;VALUE=DATE:'+compact(addDays(it.date,1)); }
    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dugun Plani//TR','BEGIN:VEVENT','UID:'+Date.now()+'@dugun-plani','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',start,end,'SUMMARY:'+icsEscape(it.title),'DESCRIPTION:'+icsEscape(it.note),'BEGIN:VALARM','TRIGGER:-PT9H','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(it.title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');

  function gcalUrl(it){

  function download(name, text, type){

  function renderSearch(){
    var q=V.q.trim().toLocaleLowerCase('tr'); if(q.length<2) return '<p class="muted">En az 2 harf yazın.</p>';
    var hit=function(){ return [].slice.call(arguments).join(' ').toLocaleLowerCase('tr').indexOf(q)>-1; };
    var mark=function(s){ s=String(s||''); var i=s.toLocaleLowerCase('tr').indexOf(q); return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); };
    var R=[];
    S.tasks.forEach(function(t){ if(hit(t.title,t.note,t.who)) R.push(['İş · '+evName(t.event), t.title, t.note, 'task:'+t.id]); });
    S.expenses.forEach(function(x){ if(hit(x.item,x.note,x.category,x.paidBy)) R.push(['Harcama · '+tl(x.amount), x.item, x.note, 'expenses:'+x.id]); });
    S.payments.forEach(function(x){ if(hit(x.title,vendorName(x),x.note)) R.push(['Ödeme · kalan '+tl(remaining(x)), x.title, vendorName(x)||x.note, 'payment:'+x.id]); });
    S.guests.forEach(function(x){ if(hit(x.name,x.note,x.phone,x.side)) R.push(['Davetli · '+(x.count||1)+' kişi', x.name, x.note||x.side, 'guests:'+x.id]); });
    S.gifts.forEach(function(x){ if(hit(x.from,x.detail,x.type)) R.push(['Takı & hediye', x.from, (x.type||'')+' '+(x.detail||''), 'gifts:'+x.id]); });
    S.ceyiz.forEach(function(x){ if(hit(x.item,x.note,x.room)) R.push(['Çeyiz · '+(x.room||''), x.item, x.note, 'ceyiz:'+x.id]); });
    S.vendors.forEach(function(x){ if(hit(x.name,x.note,x.type,x.phone,x.price)) R.push(['Rehber · '+(x.type||''), x.name, x.note||x.phone, 'vendors:'+x.id]); });
    S.notes.forEach(function(x){ if(hit(x.title,x.text)) R.push(['Not', x.title, x.text, 'notes:'+x.id]); });
    S.schedule.forEach(function(x){ if(hit(x.title,x.note)) R.push(['Günün akışı · '+evName(x.event)+' '+x.time, x.title, x.note, 'schedule:'+x.id]); });

  }

    closeSearch(); reset();
    if(k==='task'){ var t=byId(S.tasks,id); if(!t) return; V.sec='plan'; V.ev=t.event; V.planView='isler'; V.whoF='Hepsi'; open[id]=true; if(t.done) showDone[t.event]=true; anchor='task-'+id; }
    else if(k==='ev'){ V.sec='plan'; V.ev=id; V.planView='isler'; }
    else if(k==='altin'){ V.sec='para'; V.paraView='altin'; }
    else if(k==='para'){ V.sec='para'; V.paraEv='Hepsi'; V.paraView='ozet'; }
    else if(k==='paraev'){ V.sec='para'; V.paraEv=id; V.paraView='harcamalar'; }
    else if(k==='list'){ V.sec='liste'; V.listeView=id; }
    else if(k==='payment'||k==='payments'){ V.sec='para'; V.paraEv='Hepsi'; V.paraView='odemeler'; anchor='payment-'+id; }
    else if(k==='expenses'){ V.sec='para'; V.paraEv='Hepsi'; V.paraView='harcamalar'; editing={c:k,id:id}; anchor='expenses-'+id; }
    else if(k==='schedule'){ var s=byId(S.schedule,id); V.sec='plan'; V.ev=s&&s.event; V.planView='akis'; editing={c:k,id:id}; }
    else { V.sec='liste'; V.listeView={guests:'davetli',gifts:'hediye',ceyiz:'ceyiz',vendors:'rehber',notes:'notlar'}[k]||'davetli'; V.guestEv='Hepsi'; V.guestSide='Hepsi'; V.roomF='Hepsi'; editing={c:k,id:id}; anchor=k+'-'+id; }

    if(kind==='tasks'){ head=['Etkinlik','İş','Kim','Önemli','Tarih','Tamam','Not']; rows=S.tasks.map(function(t){ return [E(t.event),t.title,t.who,t.important?'Evet':'',t.due||'',t.done?'Evet':'Hayır',t.note||'']; }); }
    if(kind==='expenses'){ head=['Tarih','Kalem','Tutar','Etkinlik','Kategori','Ödeyen','Not']; rows=S.expenses.map(function(x){ return [x.date,x.item,x.amount,E(x.event),x.category,x.paidBy,x.note]; }); }
    if(kind==='payments'){ head=['Ödeme','Firma','Etkinlik','Toplam','Ödenen','Kalan','Sonraki tarih','Not']; rows=S.payments.map(function(x){ return [x.title,vendorName(x),E(x.event),x.total,x.paid||0,remaining(x),x.due,x.note]; }); }
    if(kind==='guests'){ head=['Ad','Kişi','Taraf','Telefon','Etkinlikler','Davetiye','Katılım','Not']; rows=S.guests.map(function(x){ return [x.name,x.count||1,x.side,x.phone,(x.events||[]).map(E).join(', '),x.invited?'Gitti':'Gitmedi',x.rsvp,x.note]; }); }
    if(kind==='gifts'){ head=['Kimden','Etkinlik','Ne','Adet/gram','Değer','Açıklama','Karşılığı verildi']; rows=S.gifts.map(function(x){ return [x.from,E(x.event),x.type,x.qty,giftValue(x).v,x.detail,x.returned?'Evet':'Hayır']; }); }
    if(kind==='ceyiz'){ head=['Eşya','Oda','Öncelik','Fiyat','Kim alıyor','Alındı','Not']; rows=S.ceyiz.map(function(x){ return [x.item,x.room,x.prio,x.price,x.buyer,x.bought?'Evet':'Hayır',x.note]; }); }
    if(kind==='vendors'){ head=['Ad','Tür','Durum','Telefon','Teklif','Etkinlik','Not']; rows=S.vendors.map(function(x){ return [x.name,x.type,x.status||'Fiyat alındı',x.phone,x.price,E(x.event),x.note]; }); }
    if(kind==='notes'){ head=['Başlık','Not','Etkinlik','Fotoğraf sayısı']; rows=S.notes.map(function(x){ return [x.title,x.text,E(x.event),(x.photos||[]).length]; }); }
    var cell=function(v){ v=v==null?'':String(v); if(/^[0-9.]+$/.test(v)) v=v.replace('.',','); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    var text='\ufeff'+[head].concat(rows).map(function(r){ return r.map(cell).join(';'); }).join('\r\n');
    shareOrDownload('dugun-plani-'+kind+'-'+today()+'.csv', text, 'text/csv;charset=utf-8').then(function(ok){ if(ok) toast('Dosya hazır'); });
  }
  function backup(){
    var o=JSON.parse(db.exportJSON()); o.photos=Object.assign({},PHC);
    shareOrDownload('dugun-plani-yedek-'+today()+'.json', JSON.stringify(o), 'application/json').then(function(ok){
      if(!ok) return; db.doc('settings/meta').set(Object.assign({}, S.meta||{}, {lastBackup:new Date().toISOString()})); toast('Yedek hazır'); });
  }

  // ---------- Bağlantılı kayıtlar ----------
  // Çeyizde "alındı" + fiyat = Ev & Çeyiz harcaması. Alındı kaldırılırsa harcama da silinir.
  function syncCeyiz(id, c){
    var want=c.bought && Number(c.price)>0, exp=c.expenseId && byId(S.expenses,c.expenseId);
    if(want){
      var data={item:'Çeyiz: '+c.item, amount:Number(c.price), event:homeEventId(), category:'Ev eşyası', paidBy:c.buyer||'Ortak', note:'Çeyiz listesinden', ceyizId:id};
      if(exp) return col('expenses').doc(exp.id).update(data);
      data.date=''; data.createdAt=Date.now();
      return col('expenses').add(data).then(function(ref){ return col('ceyiz').doc(id).update({expenseId:ref.id}); });
    }
    if(exp) return col('expenses').doc(exp.id).delete().then(function(){ return col('ceyiz').doc(id).update({expenseId:''}); });
    if(c.expenseId) return col('ceyiz').doc(id).update({expenseId:''});
    return Promise.resolve();
  }
  function afterAdd(c, id, o){
    if(c==='payments' && Number(o.paid)>0)
      return col('expenses').add({item:'Kapora: '+o.title, amount:Number(o.paid), event:o.event, category:o.category||'Diğer', paidBy:o.paidBy||L('payers')[0], date:today(), note:'Ödeme takibinden', paymentId:id, createdAt:Date.now()});
    if(c==='ceyiz') return syncCeyiz(id, o);
    if(c==='vendors' && o.status==='Anlaşıldı'){ adding='pay-'+id; }
    return Promise.resolve();
  }

  // ---------- Olaylar ----------
  function delDoc(key){
    var p=key.split(':'), c=p[0], id=p[1];
    if(c==='goldbuy') c='expenses';
    if(c==='events'){
      S.tasks.filter(function(t){return t.event===id;}).forEach(function(t){ col('tasks').doc(t.id).delete(); });
      S.phases.filter(function(x){return x.event===id;}).forEach(function(x){ col('phases').doc(x.id).delete(); });
      S.schedule.filter(function(x){return x.event===id;}).forEach(function(x){ col('schedule').doc(x.id).delete(); });
      editEv[id]=false;
      return col('events').doc(id).delete().then(function(){ toast('Etkinlik silindi'); });
    }
    if(c==='ceyiz'){ var cz=byId(S.ceyiz,id); if(cz&&cz.expenseId&&byId(S.expenses,cz.expenseId)) col('expenses').doc(cz.expenseId).delete(); }
    if(c==='expenses'){ var ex=byId(S.expenses,id); if(ex&&ex.ceyizId&&byId(S.ceyiz,ex.ceyizId)) col('ceyiz').doc(ex.ceyizId).update({expenseId:''}); }
    editing=null; return col(c).doc(id).delete().then(function(){ toast('Silindi'); });
  }
  document.getElementById('tabbar').addEventListener('click', function(e){ var b=e.target.closest('[data-sec]'); if(!b) return; closeSearch(); go(b.getAttribute('data-sec')); });
  document.getElementById('searchbtn').addEventListener('click', function(){ var sb=document.getElementById('searchbox'); sb.hidden=false; document.getElementById('q').focus(); });
  document.getElementById('searchclose').addEventListener('click', function(){ closeSearch(); render(); });
  document.getElementById('q').addEventListener('input', function(e){ V.q=e.target.value; pendingRender=false; var m=document.getElementById('main'); document.getElementById('pagetitle').textContent=V.q?'Arama':TITLES[V.sec]; if(V.q) m.innerHTML=renderSearch(); else render(); });
  document.getElementById('vclose').addEventListener('click', closeViewer);
  document.getElementById('viewer').addEventListener('click', function(e){ if(e.target.id==='viewer' || e.target.classList.contains('vimg')) closeViewer(); });
  document.getElementById('vdel').addEventListener('click', function(){ if(!viewer) return; if(!viewer.confirm){ viewer.confirm=true; this.textContent='Emin misiniz? Tekrar dokunun'; return; } removePhoto(viewer.pid); closeViewer(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && viewer) closeViewer(); });

  document.addEventListener('click', function(e){
    var t=e.target.closest('button,[data-open],[data-goto],[data-paraev],[data-budget],[data-paraview]'); if(!t || t.closest('#tabbar') || t.closest('#viewer') || t.id==='searchbtn' || t.id==='searchclose') return;
    var g=function(n){ return t.getAttribute(n); }, has=function(n){ return t.hasAttribute(n); };
    if(has('data-del')){ var k=g('data-del'); if(confirmDel!==k){ confirmDel=k; render(); return; } confirmDel=null; delDoc(k); return; }
    confirmDel=null;
    if(has('data-viewph')){ openViewer(g('data-viewph'), t.closest('.phs')); return; }
    if(has('data-refreshprices')){ loadMarket(true); return; }
    if(has('data-goto')){ goto(g('data-goto')); return; }
    if(has('data-sec2')){ go(g('data-sec2')); return; }
    if(has('data-ev')){ V.ev=g('data-ev'); V.whoF='Hepsi'; reset(); keepView(); render(); return; }
    if(has('data-planview')){ V.planView=g('data-planview'); reset(); keepView(); render(); return; }
    if(has('data-paraev')){ V.paraEv=g('data-paraev'); reset(); keepView(); render(); return; }
    if(has('data-paraview')){ V.paraView=g('data-paraview'); reset(); keepView(); render(); return; }
    if(has('data-budget')){ budgetEdit=g('data-budget'); render(); var bf=document.getElementById('bf'); if(bf) bf.focus(); return; }
    if(has('data-listeview')){ V.listeView=g('data-listeview'); reset(); keepView(); render(); return; }
    if(has('data-who')){ V.whoF=g('data-who'); keepView(); render(); return; }
    if(has('data-guestev')){ V.guestEv=g('data-guestev'); keepView(); render(); return; }
    if(has('data-guestside')){ V.guestSide=g('data-guestside'); keepView(); render(); return; }
    if(has('data-room')){ V.roomF=g('data-room'); keepView(); render(); return; }
    if(has('data-star')){ var sid=g('data-star'), st=byId(S.tasks,sid); if(st) upd('tasks',sid,{important:!st.important}); return; }
    if(has('data-open')){ var id=g('data-open'); open[id]=!open[id]; calFor=null; render(); return; }
    if(has('data-showdone')){ var se=g('data-showdone'); showDone[se]=!showDone[se]; render(); return; }
    if(has('data-closeall')){ var ce=g('data-closeall'); tasksOf(ce).filter(function(x){return !x.done;}).forEach(function(x){ col('tasks').doc(x.id).update({done:true}); }); toast('İşler tamamlandı sayıldı'); return; }
    if(has('data-cleardue')){ upd('tasks',g('data-cleardue'),{due:''},'Tarih kaldırıldı'); return; }
    if(has('data-editev')){ var ev=g('data-editev'); editEv[ev]=!editEv[ev]; render(); return; }
    if(has('data-adding')){ adding=g('data-adding'); editing=null; payFor=null; render(); var f=document.querySelector('[data-addform] input:not([type=checkbox]):not([type=file])'); if(f) f.focus(); return; }
    if(has('data-edit')){ var p=g('data-edit').split(':'); editing = isEditing(p[0],p[1]) ? null : {c:p[0],id:p[1]}; adding=null; payFor=null; calFor=null; render(); return; }
    if(has('data-cancel')){ editing=null; adding=null; payFor=null; budgetEdit=null; render(); return; }
    if(has('data-pay')){ payFor=g('data-pay'); editing=null; render(); return; }
    if(has('data-cal')){ calFor=g('data-cal'); render(); return; }
    if(has('data-ics')){ var c=g('data-ics').split(':'), it=calItem(c[0],c[1]); if(it){ download('takvim.ics', icsFor(it), 'text/calendar'); toast('Açılan ekranda "Takvime Ekle"ye dokunun'); } calFor=null; render(); return; }
    if(has('data-backup')){ backup(); return; }
    if(has('data-gmclear')){ db.doc('settings/goldmanual').set({}).then(function(){ toast('Piyasa fiyatlarına dönüldü'); }); return; }
    if(has('data-csv')){ csv(g('data-csv')); return; }
    if(has('data-rsvp')){ var gid=g('data-rsvp'), gu=byId(S.guests,gid), nx=RSVP[(RSVP.indexOf(gu.rsvp||'Bekliyor')+1)%3]; upd('guests',gid,{rsvp:nx}); return; }
    if(has('data-move')){ var mv=g('data-move').split(':'), evs=events(), i=evs.findIndex(function(x){return x.id===mv[0];}), j=i+Number(mv[1]); if(j<0||j>=evs.length) return;
      var A=evs[i], B=evs[j], oa=A.order||i, ob=B.order||j; if(oa===ob) ob=oa+1; upd('events',A.id,{order:ob}); upd('events',B.id,{order:oa}); return; }
    if(has('data-rmlist')){ var r=g('data-rmlist').split(':'), pp=Object.assign({}, S.people||{}), list=L(r[0]).slice(); list.splice(Number(r[1]),1); pp[r[0]]=list; db.doc('settings/people').set(pp).then(function(){toast('Liste güncellendi');}); return; }
  });

  document.addEventListener('change', function(e){
    var el=e.target, g=function(n){return el.getAttribute(n);};
    if(el.hasAttribute('data-phadd')){
      var files=[].slice.call(el.files||[]), key=g('data-phadd'), strip=el.closest('.phs'); el.value='';
      if(!files.length) return; toast('Fotoğraf hazırlanıyor…');
      files.reduce(function(p,f){ return p.then(function(ids){ return compress(f).then(function(d){ var id=newPid(); return PH.put(id,d).then(function(){ return ids.concat([id]); }); }); }); }, Promise.resolve([]))
        .then(function(ids){ return attachPhotos(key, strip, ids).then(function(){ toast(ids.length===1?'Fotoğraf eklendi':ids.length+' fotoğraf eklendi'); }); }).catch(fail);
      return;
    }
    if(el.id==='restore' && el.files && el.files[0]){ var fr=new FileReader(); fr.onload=function(){ try{ var o=JSON.parse(fr.result); db.importJSON(fr.result); if(o.photos && typeof o.photos==='object') PH.putMany(o.photos).then(render).catch(fail); toast('Yedek yüklendi'); }catch(x){ toast(x.message||'Dosya okunamadı'); } el.value=''; }; fr.readAsText(el.files[0]); return; }
    if(el.name==='qgtype'){ V.qgType=el.value; keepView(); render(); return; }
    if(el.id==='qg-ev'){ V.qgEv=el.value; keepView(); return; }
    if(el.hasAttribute('data-gm')){ var gp=g('data-gm').split(':'), gm=JSON.parse(JSON.stringify(S.goldManual||{})), gvv=Number(el.value)||0;
      gm[gp[0]]=gm[gp[0]]||{}; if(gvv>0) gm[gp[0]][gp[1]]=gvv; else delete gm[gp[0]][gp[1]]; if(!Object.keys(gm[gp[0]]).length) delete gm[gp[0]];
      db.doc('settings/goldmanual').set(gm).then(function(){ toast(gvv>0?'Kendi fiyatınız kaydedildi':'Piyasa fiyatı kullanılacak'); }); return; }
    if(/^[ae]-goldType$/.test(el.id)){ var pre=el.id.slice(0,2), gd=GOLD[el.value], sp=gd&&price(gd.k,'sell'); if(sp){ document.getElementById(pre+'unitPrice').value=sp; } goldCalc(pre); return; }
    if(el.hasAttribute('data-done')){ upd('tasks',g('data-done'),{done:el.checked}); return; }
    if(el.hasAttribute('data-invited')){ upd('guests',g('data-invited'),{invited:el.checked}); return; }
    if(el.hasAttribute('data-bought')){ var cid=g('data-bought'), cz=byId(S.ceyiz,cid); if(!cz) return; var merged=Object.assign({},cz,{bought:el.checked});
      upd('ceyiz',cid,{bought:el.checked}).then(function(){ return syncCeyiz(cid, merged); }).then(function(){ if(el.checked) toast(Number(cz.price)>0?'Alındı · '+tl(cz.price)+' Para\'ya işlendi':'Alındı · fiyat girerseniz Para\'ya da işlenir'); }); return; }
    if(el.hasAttribute('data-tf')){ var f=g('data-tf'), v=el.type==='checkbox'?el.checked:el.value; if(f==='title'){ v=v.trim(); if(!v){ toast('İş adı boş olamaz'); return; } } var d={}; d[f]=v; upd('tasks',g('data-t'),d,f==='note'?'Not kaydedildi':f==='event'?'İş taşındı':'Kaydedildi'); return; }
    if(el.hasAttribute('data-evf')){ var ef=g('data-evf'), ed={};
      if(ef==='name'){ if(!el.value.trim()) return; ed.name=el.value.trim(); } else if(ef==='budget') ed.budget=Number(el.value)||0; else if(ef==='done') ed.done=el.checked; else ed[ef]=el.value;
      upd('events',g('data-ev'),ed,'Kaydedildi'); return; }
  });

  document.addEventListener('submit', function(e){
    e.preventDefault(); var f=e.target, g=function(n){return f.getAttribute(n);};
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if(f.hasAttribute('data-addform')){ var c=g('data-addform'), fixed=f.hasAttribute('data-fixed')?JSON.parse(g('data-fixed')):null, o=readForm(c,f,'a-',fixed,false); if(!o){ toast('Zorunlu alanları doldurun'); return; }
      if(c==='goldbuy'){ o=goldToExpense(o); c='expenses'; }
      o.createdAt=Date.now(); adding=null;
      col(c).add(o).then(function(ref){ return Promise.resolve(afterAdd(c, ref.id, o)).then(function(){ toast(c==='payments'&&Number(o.paid)>0?'Eklendi · kapora harcamalara işlendi':'Eklendi'); render(); }); }).catch(fail); return; }
    if(f.hasAttribute('data-editform')){ var p=g('data-editform').split(':'), o2=readForm(p[0],f,'e-',null,true); if(!o2){ toast('Zorunlu alanları doldurun'); return; }
      if(p[0]==='goldbuy'){ o2=goldToExpense(o2); p[0]='expenses'; }
      if(p[0]==='schedule'){ var old=byId(S.schedule,p[1]); if(old) o2.event=old.event; }
      var before=byId(S[p[0]]||[],p[1]);
      editing=null; upd(p[0],p[1],o2,'Kaydedildi').then(function(){ if(p[0]==='ceyiz') return syncCeyiz(p[1], Object.assign({},before,o2)); }); return; }
    if(f.hasAttribute('data-payform')){ var pid=g('data-payform'), pay=byId(S.payments,pid), amt=Number(document.getElementById('pf-amt').value)||0; if(!amt) return;
      var who=document.getElementById('pf-who').value, date=document.getElementById('pf-date').value, next=document.getElementById('pf-next').value;
      var newPaid=(Number(pay.paid)||0)+amt, upd2={paid:newPaid}; if(next) upd2.due=next; else if(newPaid>=(pay.total||0)) upd2.due='';
      payFor=null; upd('payments',pid,upd2).then(function(){ return col('expenses').add({item:pay.title+(vendorName(pay)&&pay.title.indexOf(vendorName(pay))<0?' ('+vendorName(pay)+')':''),amount:amt,event:pay.event,category:pay.category||'Diğer',paidBy:who,date:date,note:'Ödeme takibinden',paymentId:pid,createdAt:Date.now()}); }).then(function(){ toast('Ödeme kaydedildi, harcamalara da işlendi'); }); return; }
    if(f.hasAttribute('data-budgetform')){ var bid=g('data-budgetform'); budgetEdit=null; upd('events',bid,{budget:Number(document.getElementById('bf').value)||0},'Bütçe kaydedildi'); return; }
    if(f.hasAttribute('data-addtask')){ var ev=g('data-addtask'), title=document.getElementById('nt').value.trim(); if(!title){ toast('İşi yazın'); document.getElementById('nt').focus(); return; }
      col('tasks').add({event:ev,title:title,who:document.getElementById('nw').value,due:document.getElementById('nd').value||'',important:document.getElementById('ni').checked,order:Date.now(),done:false,note:'',createdAt:Date.now()}).then(function(){toast('İş eklendi');});
      document.getElementById('nt').value=''; return; }
    if(f.hasAttribute('data-quickgift')){ var from=document.getElementById('qg-from').value.trim(); if(!from){ toast('Kimden olduğunu yazın'); document.getElementById('qg-from').focus(); return; }
      var qty=Number(document.getElementById('qg-qty').value)||0, type=V.qgType, gv={from:from, event:document.getElementById('qg-ev').value, type:type, qty:type==='Para'?'':(qty||''), value:type==='Para'?qty:0, detail:'', returned:false, createdAt:Date.now()};
      V.qgEv=gv.event; keepView(); qgFrom=''; document.getElementById('qg-from').value=''; refocus='qg-from';
      col('gifts').add(gv).then(function(){ toast('Eklendi: '+from+' · '+(type==='Para'?tl(qty):(qty?fmtQty(qty)+' ':'')+type)); }); return; }
    if(f.id==='evform'){ var n=document.getElementById('ne-name').value.trim(); if(!n) return; var mx=Math.max.apply(null,[0].concat(S.events.map(function(x){return x.order||0;})));
      col('events').add({name:n,date:document.getElementById('ne-date').value||'',budget:0,order:mx+1}).then(function(ref){
        V.sec='plan'; V.ev=ref.id; editEv[ref.id]=true; keepView(); toast('Etkinlik eklendi'); render(); }); return; }
    if(f.hasAttribute('data-addlist')){ var k=g('data-addlist'), inp=document.getElementById('nl-'+k), val=inp.value.trim(); if(!val) return;
      if(L(k).indexOf(val)>-1){ toast('Bu zaten listede'); return; } var pp=Object.assign({}, S.people||{}); pp[k]=L(k).concat([val]); db.doc('settings/people').set(pp).then(function(){toast('Eklendi');}); }
  });

  // ---------- Başlat ----------
  function rows(snap){ return snap.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; }); }
  COLLS.forEach(function(c){
    col(c).onSnapshot(function(s){ S[c]=rows(s); loaded[c]=true; render(); });
  });
  db.doc('settings/people').onSnapshot(function(s){ S.people=s.exists?s.data():null; render(); });
  db.doc('settings/meta').onSnapshot(function(s){ S.meta=s.exists?s.data():{}; render(); });
  db.doc('settings/market').onSnapshot(function(s){ S.market=s.exists?s.data():null; render(); });
  db.doc('settings/goldmanual').onSnapshot(function(s){ S.goldManual=s.exists?s.data():{}; render(); });
  PH.loadAll().catch(function(){}).then(function(){ S.photosReady=true; render(); setTimeout(gcPhotos, 4000); });
  loadMarket(false);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && Date.now()-lastPriceCheck>20*60000) loadMarket(false); });
  setTimeout(function(){ var e0=evById(V.ev); if(e0&&e0.done) V.ev=null; S.ready=true; render(); }, 0);
})();
</script>

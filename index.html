<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Düğün Planı">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Söz, Kına ve Düğün Planı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Üstte başlık ve arama, ortada seçili bölüm, altta sabit menü çubuğu. Tek sütun, telefona göre. */
:root{
  --bg:#fbf8f8; --surface:#ffffff; --sunk:#f4eeef; --fg:#2a1f22; --muted:#7a6a6e; --line:#ecdfe1;
  --accent:#9e2a3a; --accent-soft:#f6e4e7; --done:#4f7a5a; --done-soft:#e5efe7; --warn:#b5651d; --warn-soft:#f8ebdf;
  --display:"Young Serif",Georgia,serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1416; --surface:#251c1f; --sunk:#201719; --fg:#f2e9eb; --muted:#b09ea3; --line:#3a2c30;
  --accent:#e0798a; --accent-soft:#3a2229; --done:#8cc29a; --done-soft:#1f2c22; --warn:#e3a46a; --warn-soft:#33251a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1416; --surface:#251c1f; --sunk:#201719; --fg:#f2e9eb; --muted:#b09ea3; --line:#3a2c30;
  --accent:#e0798a; --accent-soft:#3a2229; --done:#8cc29a; --done-soft:#1f2c22; --warn:#e3a46a; --warn-soft:#33251a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;text-wrap:balance}
h3{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.panel{display:flex;flex-direction:column;gap:20px}
.sub{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sub button,.chip{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:99px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.sub button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip{padding:4px 11px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.sum .t{font-size:.8rem;color:var(--muted)} .sum .v{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)} .bar.over i{background:var(--warn)}
.section{display:flex;flex-direction:column;gap:2px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.pdate{font-size:.82rem;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.item{border-bottom:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.iline{display:flex;gap:12px;align-items:flex-start}
.iline input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--done);flex:none;cursor:pointer}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ibody.click{cursor:pointer}
.ttl{overflow-wrap:anywhere}
.item.done .ttl{color:var(--muted);text-decoration:line-through}
.meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px}
.meta b{color:var(--accent);font-weight:600} .item.done .meta b{color:var(--muted)}
.late{color:var(--warn);font-weight:600}
.ok{color:var(--done);font-weight:600}
.pill{font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:var(--done-soft)} .pill.late{background:var(--warn-soft)} .pill.wait{background:var(--sunk);color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.more{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:.85rem;white-space:nowrap}
.detail{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:10px;padding:12px}
.fgrid{display:flex;flex-wrap:wrap;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);flex:1 1 150px;min-width:0}
.field.wide{flex-basis:100%}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:100%}
.field.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.9rem;flex:0 1 auto}
.field.check input{width:20px;height:20px;accent-color:var(--done)}
.multi{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--fg);font-size:.9rem}
.multi label{display:flex;gap:6px;align-items:center}
textarea{min-height:76px;resize:vertical}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.editbox{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--bg);white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.link{background:none;color:var(--accent);padding:6px 4px;font-weight:500}
.btn.danger{background:none;color:var(--warn);padding:6px 8px;font-weight:500}
.btn.small{padding:5px 10px;font-size:.85rem}
.row > .editbox{flex:1 1 100%}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;cursor:pointer;flex:none}
.empty{color:var(--muted);background:var(--sunk);border-radius:12px;padding:18px;text-align:center}
.tip{border-left:3px solid var(--accent);padding:4px 12px;color:var(--muted);font-size:.9rem}
.alert{border-radius:12px;padding:12px 14px;background:var(--warn-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 0;border-top:1px dashed var(--line)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 4px 3px 11px;font-size:.85rem}
.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:2px 6px}
.phone{user-select:all;font-variant-numeric:tabular-nums}
.time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);min-width:48px}
.hit mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.calmenu{display:flex;flex-wrap:wrap;gap:6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:flex;width:100%;max-width:760px}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.88rem;max-width:calc(100% - 40px);z-index:30;text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="pagetitle">Bugün</h1><span class="spacer"></span><button class="icon" id="searchbtn" aria-label="Ara" style="display:grid;place-items:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div>
  <div class="search" id="searchbox" hidden><input id="q" type="search" placeholder="İş, not, harcama, davetli, eşya ara…" aria-label="Ara" autocomplete="off"><button class="btn link" id="searchclose">Kapat</button></div>
  <main id="main" class="panel"><div class="empty">Yükleniyor…</div></main>
</div>
<nav class="tabbar" aria-label="Bölümler"><div class="in" id="tabbar">
  <button data-sec="bugun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Bugün</button>
  <button data-sec="plan"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11l2 2 4-4M8 17h8"/></svg>Plan</button>
  <button data-sec="para"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/></svg>Para</button>
  <button data-sec="liste"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Listeler</button>
  <button data-sec="ayar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</button>
</div></nav>
<div id="toast" hidden></div>

<script src="seed.js"></script>
<script src="store.js"></script>
<script>
(function(){
  // ---------- Sabitler ve yardımcılar ----------
  var DEF = {
    who:['İkimiz','Damat','Merve','Damat tarafı','Kız tarafı','Aileler'],
    payers:['Damat','Merve','Damat tarafı','Kız tarafı','Ortak'],
    cats:['Takı','Kıyafet','Mekân','Yemek / ikram','Organizasyon','Fotoğraf','Çiçek / süs','Davetiye','Ulaşım','Ev eşyası','Diğer'],
    vtypes:['Mekân','Fotoğrafçı','Kuaför','Pastane','Çiçekçi','Kuyumcu','Müzik','Mobilya','Beyaz eşya','Diğer'],
    sides:['Damat tarafı','Kız tarafı','Ortak arkadaş'],
    giftTypes:['Çeyrek altın','Yarım altın','Tam altın','Bilezik','Gram altın','Para','Takı','Hediye','Diğer'],
    rooms:['Salon','Mutfak','Yatak odası','Banyo','Antre','Çocuk / misafir odası','Beyaz eşya','Elektronik','Diğer']
  };
  var LISTNAMES = {who:'Görev alan kişiler', payers:'Ödeme yapanlar', cats:'Harcama kategorileri', vtypes:'Rehber türleri', sides:'Davetli tarafları', giftTypes:'Takı / hediye türleri', rooms:'Çeyiz odaları'};
  var RSVP = ['Bekliyor','Geliyor','Gelmiyor'];
  var PRIO = ['Şart','Olsa iyi','Sonra'];
  var TITLES = {bugun:'Bugün', plan:'Plan', para:'Para', liste:'Listeler', ayar:'Ayarlar'};
  // Takı türü -> fiyat anahtarı ve birim (bilezik gram üzerinden, 22 ayar)
  var GOLD = {'Çeyrek altın':{k:'ceyrek',u:'adet'},'Yarım altın':{k:'yarim',u:'adet'},'Tam altın':{k:'tam',u:'adet'},'Gram altın':{k:'gram',u:'gram'},'Bilezik':{k:'bilezik22',u:'gram'}};
  var GOLDNAMES = {ceyrek:'Çeyrek altın',yarim:'Yarım altın',tam:'Tam altın',gram:'Gram altın (24 ayar)',bilezik22:'22 ayar bilezik (gram)'};
  var PRICE_URLS = ['https://raw.githubusercontent.com/fatihdlcgl42-jpg/dugun-plani/main/prices.json','prices.json'];

  var S = {events:[], phases:[], tasks:[], expenses:[], vendors:[], guests:[], gifts:[], ceyiz:[], payments:[], schedule:[], people:null, meta:{}, market:null, goldManual:{}, ready:false};
  var V = {sec:'bugun', ev:null, planView:'isler', paraView:'odemeler', listeView:'davetli', whoF:'Hepsi', expF:'Hepsi', guestEv:'Hepsi', guestSide:'Hepsi', roomF:'Hepsi', q:''};
  var open = {}, editing = null, adding = null, editEv = {}, confirmDel = null, payFor = null, calFor = null, pendingRender = false;
  try { var saved = JSON.parse(localStorage.getItem('dp-view')||'{}'); Object.keys(saved).forEach(function(k){ if(k in V && k!=='q') V[k]=saved[k]; }); } catch(e){}
  function keepView(){ try{ var o=Object.assign({},V); delete o.q; localStorage.setItem('dp-view', JSON.stringify(o)); }catch(e){} }

  var db = window.LocalDB;
  var col = function(n){ return db.collection(n); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var tl = function(n){ return (Number(n)||0).toLocaleString('tr-TR',{maximumFractionDigits:2}) + ' ₺'; };
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parse(s){ if(!s) return null; var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
  function diff(a,b){ return Math.round((parse(a)-parse(b))/86400000); }
  var today = function(){ return iso(new Date()); };
  function fd(s, long){ var d=parse(s); if(!d) return ''; return d.toLocaleDateString('tr-TR', long?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long',weekday:'short'}); }
  function rel(off){ off=Number(off)||0; if(off===0) return 'etkinlik günü'; var a=Math.abs(off), u=(a%30===0?(a/30)+' ay':a%7===0?(a/7)+' hafta':a+' gün'); return u+(off>0?' önce':' sonra'); }
  function inDays(d){ var n=diff(d,today()); return n===0?'bugün':n===1?'yarın':n===-1?'dün':n>0?n+' gün sonra':(-n)+' gün önce'; }
  function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){el.hidden=true;},2600); }
  function fail(e){ toast((e&&e.message)||'Kaydedilemedi.'); }
  function L(k){ var p=S.people||{}; return p[k] || DEF[k]; }
  function opts(list, sel){ return list.map(function(w){ return '<option'+(w===sel?' selected':'')+'>'+esc(w)+'</option>'; }).join('') + (sel && list.indexOf(sel)<0 ? '<option selected>'+esc(sel)+'</option>' : ''); }
  function sum(a,f){ return a.reduce(function(t,x){ return t+(Number(f?f(x):x)||0); },0); }
  function events(){ return S.events.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }); }
  function evById(id){ return S.events.filter(function(e){return e.id===id;})[0]; }
  function evName(id){ var e=evById(id); return e?e.name:'—'; }
  function phasesOf(ev){ return S.phases.filter(function(p){return p.event===ev;}).sort(function(a,b){ return (b.offset||0)-(a.offset||0) || (a.order||0)-(b.order||0); }); }
  function phaseOfTask(t){ return t.phaseId || (t.event+'-'+t.porder); }
  function phaseDate(p){ var e=evById(p.event); return e && e.date ? addDays(e.date, -(Number(p.offset)||0)) : null; }
  function taskDue(t){ if(t.due) return t.due; var p=S.phases.filter(function(x){return x.id===phaseOfTask(t);})[0]; return p ? phaseDate(p) : null; }
  function upd(c,id,data,msg){ return col(c).doc(id).update(data).then(function(){ if(msg) toast(msg); }, fail); }
  function delBtn(key, label){ return '<button type="button" class="btn danger" data-del="'+key+'">'+(confirmDel===key?'Silinsin mi? Tekrar dokun':(label||'Sil'))+'</button>'; }

  // ---------- Altın fiyatları ----------
  function isManual(k,side){ return Number(((S.goldManual||{})[k]||{})[side])>0; }
  function price(k,side){
    if(isManual(k,side)) return Number(S.goldManual[k][side]);
    var it=S.market&&S.market.items&&S.market.items[k]; return it&&Number(it[side])>0?Number(it[side]):0;
  }
  function goldNow(type, qty){ var gd=GOLD[type], p=gd&&price(gd.k,'buy'); return p&&Number(qty)>0 ? p*Number(qty) : 0; }
  function giftValue(g){ if(Number(g.value)>0) return {v:Number(g.value),auto:false}; var v=goldNow(g.type,g.qty); return {v:v,auto:v>0}; }
  function fmtQty(n){ return (Number(n)||0).toLocaleString('tr-TR',{maximumFractionDigits:2}); }
  function fdt(s){ var d=new Date(s); return isNaN(d) ? '' : d.toLocaleString('tr-TR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}); }
  function goldToExpense(o){
    var gd=GOLD[o.goldType]||{u:'adet'};
    return {item:fmtQty(o.qty)+(gd.u==='gram'?' gr ':' adet ')+o.goldType+(o.shop?' · '+o.shop:''), amount:Number(o.amount)||0, event:o.event, category:'Takı', paidBy:o.paidBy, date:o.date, note:o.note, goldType:o.goldType, qty:Number(o.qty)||0, unitPrice:Number(o.unitPrice)||0, shop:o.shop};
  }
  var lastPriceCheck=0;
  function loadMarket(manual){
    lastPriceCheck=Date.now();
    (function tryN(i){
      if(i>=PRICE_URLS.length){ if(manual) toast('Fiyatlar alınamadı. İnternet bağlantını kontrol et ya da kendi fiyatını gir.'); return; }
      fetch(PRICE_URLS[i]+(PRICE_URLS[i].indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(j){ if(!j||!j.items) throw 0; if(!S.market||S.market.updated!==j.updated) db.doc('settings/market').set(j); if(manual) toast('Fiyatlar güncel'); })
        .catch(function(){ tryN(i+1); });
    })(0);
  }

  // ---------- Form şemaları (her liste için alanlar) ----------
  function evOptions(){ return events().map(function(e){ return [e.id, e.name]; }); }
  var SCHEMA = {

  function compact(d){ return d.replace(/-/g,''); }
  function icsFor(it){
    var start, end;
    if(it.time){ var t=it.time.replace(':','')+'00'; start='DTSTART:'+compact(it.date)+'T'+t; var e=new Date(parse(it.date)); var hm=it.time.split(':'); e.setHours(+hm[0]+1,+hm[1]); end='DTEND:'+compact(iso(e))+'T'+String(e.getHours()).padStart(2,'0')+String(e.getMinutes()).padStart(2,'0')+'00'; }
    else { start='DTSTART;VALUE=DATE:'+compact(it.date); end='DTEND;VALUE=DATE:'+compact(addDays(it.date,1)); }
    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dugun Plani//TR','BEGIN:VEVENT','UID:'+Date.now()+'@dugun-plani','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',start,end,'SUMMARY:'+icsEscape(it.title),'DESCRIPTION:'+icsEscape(it.note),'BEGIN:VALARM','TRIGGER:-PT9H','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(it.title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');

  function gcalUrl(it){

    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.title)+'&dates='+dates+'&details='+encodeURIComponent(it.note||'');
  }

  // ---------- Arama ----------
  function renderSearch(){
    var q=V.q.trim().toLocaleLowerCase('tr'); if(q.length<2) return '<p class="muted">En az 2 harf yazın.</p>';
    var hit=function(){ return [].slice.call(arguments).join(' ').toLocaleLowerCase('tr').indexOf(q)>-1; };
    var mark=function(s){ s=String(s||''); var i=s.toLocaleLowerCase('tr').indexOf(q); return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); };
    var R=[];
    S.tasks.forEach(function(t){ if(hit(t.title,t.note,t.who)) R.push(['İş · '+evName(t.event), t.title, t.note, 'task:'+t.id]); });
    S.expenses.forEach(function(x){ if(hit(x.item,x.note,x.category,x.paidBy)) R.push(['Harcama · '+tl(x.amount), x.item, x.note, 'expenses:'+x.id]); });
    S.payments.forEach(function(x){ if(hit(x.title,x.vendor,x.note)) R.push(['Ödeme · kalan '+tl((x.total||0)-(x.paid||0)), x.title, x.vendor||x.note, 'payment:'+x.id]); });
    S.guests.forEach(function(x){ if(hit(x.name,x.note,x.phone,x.side)) R.push(['Davetli · '+(x.count||1)+' kişi', x.name, x.note||x.side, 'guests:'+x.id]); });
    S.gifts.forEach(function(x){ if(hit(x.from,x.detail,x.type)) R.push(['Takı & hediye', x.from, (x.type||'')+' '+(x.detail||''), 'gifts:'+x.id]); });
    S.ceyiz.forEach(function(x){ if(hit(x.item,x.note,x.room)) R.push(['Çeyiz · '+(x.room||''), x.item, x.note, 'ceyiz:'+x.id]); });
    S.vendors.forEach(function(x){ if(hit(x.name,x.note,x.type,x.phone,x.price)) R.push(['Rehber · '+(x.type||''), x.name, x.note||x.phone, 'vendors:'+x.id]); });
    S.schedule.forEach(function(x){ if(hit(x.title,x.note)) R.push(['Günün akışı · '+evName(x.event)+' '+x.time, x.title, x.note, 'schedule:'+x.id]); });
    if(!R.length) return '<div class="empty">"'+esc(V.q)+'" için sonuç yok.</div>';
    return '<p class="muted small">'+R.length+' sonuç</p><ul>'+R.map(function(r){ return '<li class="item hit"><div class="ibody click" data-goto="'+r[3]+'"><span class="meta"><b>'+esc(r[0])+'</b></span><span class="ttl">'+mark(r[1])+'</span>'+(r[2]?'<span class="small muted">'+mark(String(r[2]).slice(0,120))+'</span>':'')+'</div></li>'; }).join('')+'</ul>';
  }

  function render(){
    var a=document.activeElement, m=document.getElementById('main');
    if(a && /^(TEXTAREA|SELECT|INPUT)$/.test(a.tagName) && a.type!=='checkbox' && m.contains(a)){ pendingRender=true; return; }
    pendingRender=false;
    if(!S.ready) return;
    document.querySelectorAll('#tabbar button').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-sec')===V.sec && !V.q)); });
    if(V.q){ document.getElementById('pagetitle').textContent='Arama'; m.innerHTML=renderSearch(); return; }
    document.getElementById('pagetitle').textContent=TITLES[V.sec];
    m.innerHTML = V.sec==='plan'?renderPlan():V.sec==='para'?renderPara():V.sec==='liste'?renderListe():V.sec==='ayar'?renderAyar():renderBugun();

  function reset(){ editing=null; adding=null; payFor=null; calFor=null; confirmDel=null; }
  function go(sec){ V.sec=sec; reset(); keepView(); render(); window.scrollTo({top:0}); }
  function goto(target){
    var p=target.split(':'), k=p[0], id=p[1], anchor=null;
    V.q=''; document.getElementById('q').value=''; document.getElementById('searchbox').hidden=true; reset();
    if(k==='task'){ var t=S.tasks.filter(function(x){return x.id===id;})[0]; if(!t) return; V.sec='plan'; V.ev=t.event; V.planView='isler'; V.whoF='Hepsi'; open[id]=true; anchor='task-'+id; }
    else if(k==='ev'){ V.sec='plan'; V.ev=id; V.planView='isler'; }
    else if(k==='altin'){ V.sec='para'; V.paraView='altin'; }
    else if(k==='payment'||k==='payments'){ V.sec='para'; V.paraView='odemeler'; anchor='payment-'+id; }
    else if(k==='expenses'){ V.sec='para'; V.paraView='harcamalar'; V.expF='Hepsi'; editing={c:k,id:id}; anchor='expenses-'+id; }
    else if(k==='schedule'){ var s=S.schedule.filter(function(x){return x.id===id;})[0]; V.sec='plan'; V.ev=s&&s.event; V.planView='akis'; editing={c:k,id:id}; }
    else { V.sec='liste'; V.listeView={guests:'davetli',gifts:'hediye',ceyiz:'ceyiz',vendors:'rehber'}[k]; V.guestEv='Hepsi'; V.guestSide='Hepsi'; V.roomF='Hepsi'; editing={c:k,id:id}; anchor=k+'-'+id; }
    keepView(); render();

  }

  // ---------- Dışa aktarma ----------
  function csv(kind){
    var rows, head;
    var E=function(id){return evName(id);};
    if(kind==='tasks'){ head=['Etkinlik','Dönem','İş','Kim','Tarih','Tamam','Not']; rows=S.tasks.map(function(t){ var p=S.phases.filter(function(x){return x.id===phaseOfTask(t);})[0]; return [E(t.event),p?p.name:'',t.title,t.who,taskDue(t)||'',t.done?'Evet':'Hayır',t.note||'']; }); }
    if(kind==='expenses'){ head=['Tarih','Kalem','Tutar','Etkinlik','Kategori','Ödeyen','Not']; rows=S.expenses.map(function(x){ return [x.date,x.item,x.amount,E(x.event),x.category,x.paidBy,x.note]; }); }
    if(kind==='payments'){ head=['Ödeme','Firma','Etkinlik','Toplam','Ödenen','Kalan','Sonraki tarih','Not']; rows=S.payments.map(function(x){ return [x.title,x.vendor,E(x.event),x.total,x.paid||0,(x.total||0)-(x.paid||0),x.due,x.note]; }); }
    if(kind==='guests'){ head=['Ad','Kişi','Taraf','Telefon','Etkinlikler','Davetiye','Katılım','Not']; rows=S.guests.map(function(x){ return [x.name,x.count||1,x.side,x.phone,(x.events||[]).map(E).join(', '),x.invited?'Gitti':'Gitmedi',x.rsvp,x.note]; }); }
    if(kind==='gifts'){ head=['Kimden','Etkinlik','Ne','Adet/gram','Değer','Açıklama','Karşılığı verildi']; rows=S.gifts.map(function(x){ return [x.from,E(x.event),x.type,x.qty,giftValue(x).v,x.detail,x.returned?'Evet':'Hayır']; }); }
    if(kind==='ceyiz'){ head=['Eşya','Oda','Öncelik','Fiyat','Kim alıyor','Alındı','Not']; rows=S.ceyiz.map(function(x){ return [x.item,x.room,x.prio,x.price,x.buyer,x.bought?'Evet':'Hayır',x.note]; }); }
    if(kind==='vendors'){ head=['Ad','Tür','Telefon','Fiyat','Not']; rows=S.vendors.map(function(x){ return [x.name,x.type,x.phone,x.price,x.note]; }); }
    var cell=function(v){ v=v==null?'':String(v); if(typeof v==='string' && /^[0-9.]+$/.test(v)) v=v.replace('.',','); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    var text='\ufeff'+[head].concat(rows).map(function(r){ return r.map(cell).join(';'); }).join('\r\n');
    download('dugun-plani-'+kind+'-'+today()+'.csv', text, 'text/csv;charset=utf-8');
    toast('Dosya indirildi');
  }

  function delDoc(key){

    if(c==='events'){
      S.tasks.filter(function(t){return t.event===id;}).forEach(function(t){ col('tasks').doc(t.id).delete(); });
      S.phases.filter(function(x){return x.event===id;}).forEach(function(x){ col('phases').doc(x.id).delete(); });
      S.schedule.filter(function(x){return x.event===id;}).forEach(function(x){ col('schedule').doc(x.id).delete(); });
      return col('events').doc(id).delete().then(function(){ toast('Etkinlik silindi'); });
    }
    editing=null; return col(c).doc(id).delete().then(function(){ toast('Silindi'); });
  }

    if(el.hasAttribute('data-evf')){ var ef=g('data-evf'), ed={}; if(ef==='name'){ if(!el.value.trim()) return; ed.name=el.value.trim(); } else if(ef==='budget') ed.budget=Number(el.value)||0; else ed.date=el.value;
      upd('events',g('data-ev'),ed, ef==='date'?'Tarih kaydedildi; dönemler yeni tarihe göre kaydı':'Kaydedildi'); return; }
    if(el.hasAttribute('data-phf')){ var pf=g('data-phf'), ph=g('data-ph'), pd={}, phase=S.phases.filter(function(x){return x.id===ph;})[0];
      if(pf==='name'){ if(!el.value.trim()) return; pd.name=el.value.trim(); } else if(pf==='offset') pd.offset=Math.round(Number(el.value)||0);
      else { var evx=evById(phase.event); if(!el.value||!evx||!evx.date) return; pd.offset=diff(evx.date, el.value); }
      upd('phases',ph,pd,'Kaydedildi'); }
  });

  document.addEventListener('submit', function(e){
    e.preventDefault(); var f=e.target, g=function(n){return f.getAttribute(n);};
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if(f.hasAttribute('data-addform')){ var c=g('data-addform'), fixed=f.hasAttribute('data-fixed')?JSON.parse(g('data-fixed')):null, o=readForm(c,'a-',fixed); if(!o){ toast('Zorunlu alanları doldurun'); return; }
      if(c==='goldbuy'){ o=goldToExpense(o); c='expenses'; }
      o.createdAt=Date.now(); adding=null; col(c).add(o).then(function(){ toast('Eklendi'); }); return; }
    if(f.hasAttribute('data-editform')){ var p=g('data-editform').split(':'), o2=readForm(p[0],'e-'); if(!o2){ toast('Zorunlu alanları doldurun'); return; }
      if(p[0]==='goldbuy'){ o2=goldToExpense(o2); p[0]='expenses'; }
      if(p[0]==='schedule'){ var old=S.schedule.filter(function(x){return x.id===p[1];})[0]; if(old) o2.event=old.event; }
      editing=null; upd(p[0],p[1],o2,'Kaydedildi'); return; }
    if(f.hasAttribute('data-payform')){ var pid=g('data-payform'), pay=S.payments.filter(function(x){return x.id===pid;})[0], amt=Number(document.getElementById('pf-amt').value)||0; if(!amt) return;
      var who=document.getElementById('pf-who').value, date=document.getElementById('pf-date').value||today(), next=document.getElementById('pf-next').value;
      var newPaid=(Number(pay.paid)||0)+amt, upd2={paid:newPaid}; if(next) upd2.due=next; else if(newPaid>=(pay.total||0)) upd2.due='';
      payFor=null; upd('payments',pid,upd2).then(function(){ return col('expenses').add({item:pay.title+(pay.vendor?' ('+pay.vendor+')':''),amount:amt,event:pay.event,category:pay.category||'Diğer',paidBy:who,date:date,note:'Ödeme takibinden',createdAt:Date.now()}); }).then(function(){ toast('Ödeme kaydedildi, harcamalara da işlendi'); }); return; }
    if(f.hasAttribute('data-addtask')){ var ev=g('data-addtask'), title=document.getElementById('nt-'+ev).value.trim(); if(!title) return;
      col('tasks').add({event:ev,phaseId:document.getElementById('np-'+ev).value,title:title,who:document.getElementById('nw-'+ev).value,order:Date.now(),done:false,note:'',due:'',createdAt:Date.now()}).then(function(){toast('İş eklendi');});
      document.getElementById('nt-'+ev).value=''; return; }
    if(f.id==='evform'){ var n=document.getElementById('ne-name').value.trim(); if(!n) return; var mx=Math.max.apply(null,[0].concat(S.events.map(function(x){return x.order||0;})));
      col('events').add({name:n,date:document.getElementById('ne-date').value||'',budget:0,order:mx+1}).then(function(ref){
        col('phases').add({event:ref.id,name:'Hazırlık',offset:30,order:1}); col('phases').add({event:ref.id,name:'Etkinlik günü',offset:0,order:2});
        V.sec='plan'; V.ev=ref.id; editEv[ref.id]=true; keepView(); toast('Etkinlik eklendi; dönemlerini düzenleyin'); render(); }); return; }
    if(f.hasAttribute('data-addlist')){ var k=g('data-addlist'), inp=document.getElementById('nl-'+k), val=inp.value.trim(); if(!val) return;
      if(L(k).indexOf(val)>-1){ toast('Bu zaten listede'); return; } var pp=Object.assign({}, S.people||{}); pp[k]=L(k).concat([val]); db.doc('settings/people').set(pp).then(function(){toast('Eklendi');}); }
  });

  // ---------- Başlat ----------
  function rows(snap){ return snap.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; }); }
  ['events','phases','tasks','expenses','vendors','guests','gifts','ceyiz','payments','schedule'].forEach(function(c){
    col(c).onSnapshot(function(s){ S[c]=rows(s); render(); });
  });
  db.doc('settings/people').onSnapshot(function(s){ S.people=s.exists?s.data():null; render(); });
  db.doc('settings/meta').onSnapshot(function(s){ S.meta=s.exists?s.data():{}; render(); });
  db.doc('settings/market').onSnapshot(function(s){ S.market=s.exists?s.data():null; render(); });
  db.doc('settings/goldmanual').onSnapshot(function(s){ S.goldManual=s.exists?s.data():{}; render(); });
  loadMarket(false);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && Date.now()-lastPriceCheck>30*60000) loadMarket(false); });
  setTimeout(function(){ S.ready=true; render(); }, 0);
})();
</script>
<script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }</script>
</body>

name: Altın fiyatları

on:
  schedule:
    - cron: '17 */3 * * *'   # 3 saatte bir (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/altin.yml', 'tools/altin.py']

permissions:
  contents: write

concurrency:
  group: altin-fiyatlari
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fiyatları çek
        run: python3 tools/altin.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Altın fiyatlarını güncelle"
          git pull --rebase origin main
          git push origin HEAD:main
